<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATTACK FIXTURE — Wallet Address Leak Demo</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #c9d1d9;
        --danger: #f85149;
        --danger-bg: rgba(248, 81, 73, 0.15);
        --accent: #58a6ff;
      }
      body {
        margin: 0;
        padding: 1.5rem;
        background-color: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      .banner {
        background-color: var(--danger-bg);
        border: 2px solid var(--danger);
        color: #ff7b72;
        padding: 1rem 1.25rem;
        border-radius: 8px;
        font-weight: 700;
        margin-bottom: 1.5rem;
        font-size: 1.1rem;
      }
      .card {
        background-color: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.25rem;
        margin-bottom: 1.5rem;
      }
      .actions-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 0.75rem;
        margin-top: 1rem;
      }
      button {
        background-color: #21262d;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 0.65rem 1rem;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        text-align: left;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-danger {
        background-color: var(--danger);
        color: #ffffff;
        border: none;
      }
      .btn-danger:hover:not(:disabled) {
        background-color: #da3633;
        color: #ffffff;
      }
      .connected-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
      }
      pre {
        background-color: #010409;
        border: 1px solid var(--border);
        padding: 1rem;
        border-radius: 6px;
        color: #7ee787;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        max-height: 300px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      a {
        color: var(--accent);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      ATTACK FIXTURE — this page deliberately sends your wallet address to a third-party tracker. Demo only.
    </div>

    <div class="card">
      <div class="connected-bar">
        <div>
          <strong>Status: </strong>
          <span id="conn-status">Disconnected</span>
        </div>
        <button type="button" id="btn-connect">Connect Wallet</button>
      </div>
      <p style="font-size: 0.875rem; color: #8b949e;">
        Target Tracker Endpoint: <code id="tracker-url" style="color: #f2cc60;"></code>
      </p>
    </div>

    <div class="card">
      <h3>Address Leak Attack Vectors</h3>
      <div class="actions-grid">
        <button type="button" id="btn-leak-1" disabled>1. GET Query (checksummed)</button>
        <button type="button" id="btn-leak-2" disabled>2. GET Query (lowercase no 0x)</button>
        <button type="button" id="btn-leak-3" disabled>3. POST JSON (body.wallet)</button>
        <button type="button" id="btn-leak-4" disabled>4. POST Text (base64)</button>
        <button type="button" id="btn-leak-5" disabled>5. navigator.sendBeacon</button>
        <button type="button" id="btn-leak-6" disabled>6. Image Pixel (GET query)</button>
        <button type="button" id="btn-leak-all" class="btn-danger" disabled>7. Send All (1–6 in order)</button>
      </div>
    </div>

    <div class="card">
      <h3>Attack Log</h3>
      <p style="font-size: 0.875rem; margin-bottom: 0.5rem;">
        <a id="tracker-log-link" href="#" target="_blank" rel="noreferrer">View what the tracker received (Tracker Log)</a>
      </p>
      <pre id="log">No requests sent yet.</pre>
    </div>

    <script type="module" src="./leak.ts"></script>
  </body>
</html>
